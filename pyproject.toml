[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calvados"
version = "0.0.0"
description = "Local editable CALVADOS snapshot + REMD scripts (thesis)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["calvados*", "md_analysis_lib*"]
